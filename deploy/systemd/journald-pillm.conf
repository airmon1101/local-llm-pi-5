# PiLLM Journald Configuration for MicroSD Flash Endurance
# Drop-in configuration for /etc/systemd/journald.conf.d/pillm.conf
# Prevents endless journal growth on 64GB MicroSD cards

[Journal]
Storage=persistent
Compress=yes
SystemMaxUse=100M
SystemKeepFree=1G
SystemMaxFileSize=20M
RuntimeMaxUse=50M
MaxRetentionSec=1month
RateLimitIntervalSec=30s
RateLimitBurst=1000
