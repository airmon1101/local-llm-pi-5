# PiLLM Nginx Reverse Proxy Configuration
# Optimized for Raspberry Pi 5 - Local Home LAN Only
# Server-Sent Events (SSE) streaming enabled without buffering

upstream pillm_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

upstream pillm_frontend {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name raspberrypi.local localhost "";

    # Security Headers (LAN Defense-in-Depth)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Limit request body to prevent memory saturation on 8GB RAM
    client_max_body_size 10M;

    # 1. Backend API & Streaming SSE Endpoint
    location /api/ {
        proxy_pass http://pillm_backend;
        proxy_http_version 1.1;

        # Mandatory SSE Streaming Directives: DISABLE BUFFERING
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";
        chunked_transfer_encoding on;

        # Extended timeouts for large LLM inference operations
        proxy_read_timeout 600s;
        proxy_connect_timeout 15s;
        proxy_send_timeout 600s;

        # Forwarded identity headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. Next.js Frontend UI
    location / {
        proxy_pass http://pillm_frontend;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cache static Next.js assets
        location /_next/static/ {
            proxy_pass http://pillm_frontend;
            proxy_cache_bypass 1;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
        }
    }

    # MicroSD Wear-Reduction: Suppress disk writes for missing favicons / robots
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }

    location = /robots.txt {
        log_not_found off;
        access_log off;
    }
}
